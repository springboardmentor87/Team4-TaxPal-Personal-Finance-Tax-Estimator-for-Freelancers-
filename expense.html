<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaxPal Expense</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-header">
        <h1>TaxPal Expense Entry</h1>
        <a class="nav-link" href="index.html">Back to Income</a>
    </div>

    <div class="overlay">
        <div class="modal-box">
            <div class="modal-header">
                <div>
                    <h2>Record New Expense</h2>
                    <p>Add details about your expense to track your spending better.</p>
                </div>
                <button class="close-btn">&times;</button>
            </div>
            <form>
                <h3>Add Expense</h3>
                <div class="row">
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" placeholder="e.g. Office Supplies">
                    </div>
                    <div class="form-group">
                        <label>Amount</label>
                        <input type="number" placeholder="$0.00">
                    </div>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>Category</label>
                        <select>
                            <option>Select a category</option>
                            <option>Software</option>
                            <option>Travel</option>
                            <option>Office Supplies</option>
                            <option>Utilities</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date">
                    </div>
                </div>
                <div class="form-group">
                    <label>Notes (Optional)</label>
                    <textarea rows="4" placeholder="Add any additional details..."></textarea>
                </div>
                <div class="buttons">
                    <button type="button" class="cancel">Cancel</button>
                    <button type="submit" class="save">Save</button>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
